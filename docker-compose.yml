version: "3.9"

services:
  db:
    image: postgres:16
    container_name: hotel_db
    restart: always
    environment:
      POSTGRES_USER: hoteluser
      POSTGRES_PASSWORD: hotelpass
      POSTGRES_DB: hotel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: hotel_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://hoteluser:hotelpass@db:5432/hotel_db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: hotel_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data: